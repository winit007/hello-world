[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-agent"
version = "0.12.0"
description = "Offline stock research agent: candlestick backtests, news sentiment, call/put verdicts and a top-5 screener"
readme = "stock_agent/README.md"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.50",
    "feedparser>=6.0",
    "vaderSentiment>=3.3",
    "requests>=2.28",
    "qrcode>=7.4",
]

[project.scripts]
stock-agent = "stock_agent.__main__:main"

[tool.setuptools]
packages = ["stock_agent"]

[tool.setuptools.package-data]
stock_agent = ["*.csv", "*.json", "web/*.html", "lists/*.csv"]
